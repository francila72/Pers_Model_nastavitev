<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P&ID ogrevanje in hlajenje — list 10</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    .sheet {
      max-width: 1600px;
      margin: 24px auto;
      background: #fff;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12);
      border: 1px solid #cbd5e1;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      background: #f1f5f9;
    }
    object, svg {
      display: block;
      width: 100%;
      height: auto;
    }
    @media print {
      body { background: white; }
      .sheet {
        margin: 0;
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="meta">
      <strong>P&ID OGREVANJE / HLAJENJE</strong>
      <span>LIST 10/10 — Specifikacija izolacije</span>
    </div>
    <object data="./01-pid-ogrevanje-hlajenje-sheet10.svg" type="image/svg+xml" aria-label="P&ID list 10: specifikacija izolacije">
      <img src="./01-pid-ogrevanje-hlajenje-sheet10.svg" alt="P&ID list 10: specifikacija izolacije">
    </object>
  </main>
</body>
</html>
